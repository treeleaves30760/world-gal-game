name: CI

# Run the test suite + pack validation on every push and pull request.
# A web build-only smoke is included but allowed to be skipped/no-op when
# pygbag isn't installable, so CI never hard-fails on the optional web extra.

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Headless SDL so pygame-ce initialises with no display/audio device.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies (engine + dev/test extras)
        run: uv sync --extra dev

      - name: Lint (undefined names, unused imports, syntax)
        run: uvx ruff@0.15.0 check --select F,E9 world_gal_game tools tests main.py build.py

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Validate demo pack
        run: uv run python main.py validate games/demo_pack

      - name: Self-check demo pack (schema + refs + smoke)
        run: uv run python main.py self-check games/demo_pack

  layout-tall-font:
    # The `test` job measures layouts in the suite's pinned reference font,
    # whose lines are one em tall. Linux desktops and Android ship Noto Sans
    # CJK, whose lines are about 1.45 em; run the suite again in that font so
    # a layout that only fits short lines cannot land unnoticed.
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Install Noto Sans CJK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk fontconfig
          echo "WGG_TEST_FONT=$(fc-match -f '%{file}' 'Noto Sans CJK TC')" >> "$GITHUB_ENV"

      - name: Sync dependencies (engine + dev/test extras)
        run: uv sync --extra dev

      - name: Run tests in the tall font
        run: |
          echo "font: $WGG_TEST_FONT"
          uv run pytest tests/ -q

  runtime-reliability:
    # Host-sensitive source-runtime evidence is deliberately separate from
    # self-check. Numeric limits in this portable dummy-SDL policy are
    # observational; process/protocol, determinism, cache and plugin failures
    # remain blocking.
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies + runtime evidence extra
        run: uv sync --extra runtime

      - name: Run demo-pack runtime reliability gate
        run: >-
          uv run python -m world_gal_game.cli runtime-check games/demo_pack
          --policy games/demo_pack/content/runtime_reliability.yaml
          --report artifacts/runtime-reliability/demo-pack-linux.json

      - name: Upload runtime reliability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-reliability-${{ runner.os }}-${{ github.run_attempt }}
          path: artifacts/runtime-reliability/demo-pack-linux.json
          if-no-files-found: error
          retention-days: 14

  web-smoke:
    # Web build is the optional extra. This job stages + attempts a pygbag
    # build but never blocks CI: continue-on-error keeps a missing/incompatible
    # pygbag from turning the whole run red.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies + web extra
        # If pygbag can't be resolved this step fails, but continue-on-error
        # on the job keeps CI green — the web build is best-effort here.
        run: uv sync --extra web

      - name: Web build-only smoke
        run: uv run python build.py games/demo_pack --target web --output build/web
